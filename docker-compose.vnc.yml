version: '3.8'

services:
  xstock-vnc:
    build:
      context: .
      dockerfile: Dockerfile.vnc
    container_name: xstock-vnc

    environment:
      - TZ=Asia/Tokyo
      - DISPLAY=:99
      - VNC_PASSWORD=${VNC_PASSWORD}
      - ANTHROPIC_API_KEY
      - XAI_API_KEY
      - COOKIE_ENCRYPTION_KEY

    ports:
      - "6080:6080"  # noVNC (ブラウザからアクセス)

    volumes:
      - ./collector:/app/collector:ro
      - ./scripts:/app/scripts:ro
      - ./output:/app/output
      - ./data:/app/data
      - ./x_profile:/app/x_profile
      - ./x_profiles:/app/x_profiles
      - ./core:/app/core:ro
      - ./extensions:/app/extensions:ro
      - ./configs:/app/configs:ro
      # 2026-07-16 card cross-20260716-01: tier3_posting は phase4 で autopost リポへ物理分離。
      # scripts/fetch_engagement.py の import (tier3_posting.impression_tracker) を成立させる読取専用マウント
      - ../autopost/tier3_posting:/app/tier3_posting:ro

    shm_size: '2gb'
    security_opt:
      - seccomp:./docker/chromium-seccomp.json

  # 2026-05-01 Phase 3: review サービスは autopost リポへ移管
  # 起動: cd ~/Desktop/biz/autopost && python3 -m tier3_posting.cli.server --port 8080
